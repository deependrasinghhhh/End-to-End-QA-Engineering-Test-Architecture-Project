name: E2E QA Test Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *' # Nightly regression run at 02:00 UTC

jobs:
  test:
    name: Run Automated QA Suites (Playwright)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: "Run Playwright Tests (50 Tests - Smoke, Regression, Critical, Customer, Admin, API, A11y)"
        run: npx playwright test --project=chromium
        env:
          CI: true
          HEADLESS: true
          BASE_URL: http://localhost:5001

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/playwright-html/
          retention-days: 14

      - name: Upload JUnit XML Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: reports/junit.xml
          retention-days: 14
